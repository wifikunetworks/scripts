<!DOCTYPE html>
<html>
<head>
  <title>Complete MikroTik Auto Backup to Gmail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 2.5em;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, #fff, #f0f0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      position: relative;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: white;
      font-weight: 600;
      font-size: 0.95em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .email-input-container {
      position: relative;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      min-height: 55px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .email-input-container:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .email-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-right: 8px;
    }

    .email-tag {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: tagSlideIn 0.2s ease-out;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .email-tag .remove-tag {
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .email-tag .remove-tag:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .email-input-container input[type="text"] {
      flex: 1;
      min-width: 200px;
      border: none;
      background: transparent;
      padding: 5px;
      font-size: 16px;
      box-shadow: none;
    }

    .email-input-container input[type="text"]:focus {
      outline: none;
      transform: none;
      box-shadow: none;
      background: transparent;
      border: none;
    }

    @keyframes tagSlideIn {
      from {
        opacity: 0;
        transform: translateX(-10px) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 12px center;
      background-repeat: no-repeat;
      background-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 200px;
      font-family: 'Courier New', monospace;
      line-height: 1.5;
    }

    .note {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 5px;
      font-style: italic;
    }

    .button-container {
      display: flex;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
      grid-column: 1 / -1;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    button:hover::before {
      left: 100%;
    }

    .btn-generate {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(76, 175, 80, 0.6);
    }

    .btn-clear {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
    }

    .btn-clear:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
    }

    .btn-copy {
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
      color: white;
      box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
    }

    .btn-copy:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(78, 205, 196, 0.6);
    }

    .hidden {
      display: none;
    }

    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 20%;
      right: 10%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      width: 100px;
      height: 100px;
      bottom: 10%;
      left: 15%;
      animation-delay: 4s;
    }

    .shape:nth-child(4) {
      width: 40px;
      height: 40px;
      bottom: 20%;
      right: 20%;
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }

    .success-message {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
      transform: translateX(400px);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .success-message.show {
      transform: translateX(0);
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      h1 {
        font-size: 2em;
      }
      
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .button-container {
        flex-direction: column;
      }
      
      button {
        min-width: unset;
      }
    }
  </style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="container">
    <h1>🚀 Complete MikroTik Auto Backup</h1>

    <form id="backupForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="emailServer">📧 Email Server:</label>
          <select id="emailServer">
            <option value="74.125.24.109">74.125.24.109</option>
            <option value="74.125.68.109">74.125.68.109</option>
            <option value="74.125.136.109">74.125.136.109</option>
            <option value="74.125.137.108">74.125.137.108</option>
            <option value="74.125.200.108">74.125.200.108</option>
            <option value="74.125.200.109">74.125.200.109</option>
            <option value="smtp.gmail.com">smtp.gmail.com</option>
          </select>
        </div>

        <div class="form-group">
          <label for="routerOsVersion">⚙️ Versi RouterOS:</label>
          <select id="routerOsVersion">
            <option value="v6">RouterOS v6</option>
            <option value="v7">RouterOS v7</option>
          </select>
        </div>

        <div class="form-group">
          <label for="emailSender" class="hidden">Email Pengirim:</label>
          <input type="text" id="emailSender" class="hidden" value="mikrotikrosbackup@gmail.com">
        </div>

        <div class="form-group">
          <label for="emailPassword" class="hidden">Password Email Pengirim:</label>
          <input type="password" id="emailPassword" class="hidden" value="letkntbrshcipraz">
        </div>

        <div class="form-group">
          <label for="intervalBackup">⏰ Interval Backup:</label>
          <input type="text" id="intervalBackup" value="1d" placeholder="contoh: 1d, 12h, 30m">
        </div>

        <div class="form-group">
          <label for="title">📝 Judul Email (Subject):</label>
          <input type="text" id="title" placeholder="Backup MikroTik GR3">
        </div>

        <div class="form-group full-width">
          <label for="emailRecipient">📮 Email Penerima:</label>
          <div class="email-input-container">
            <div class="email-tags" id="emailTags"></div>
            <input type="text" id="emailRecipient" placeholder="example@gmail.com">
          </div>
          <div class="note">Untuk multiple email, pisahkan dengan koma (,)</div>
        </div>

        <div class="button-container">
          <button type="button" class="btn-generate" onclick="generateScript()">✨ Generate Script</button>
          <button type="button" class="btn-clear" onclick="clearForm()">🗑️ Clear Form</button>
          <button type="button" class="btn-copy" onclick="copyScript()">📋 Copy Script</button>
        </div>

        <div class="form-group full-width">
          <label for="backupResult">📄 Generated Script:</label>
          <textarea id="backupResult" placeholder="Script akan muncul disini setelah di-generate..."></textarea>
        </div>
      </div>
    </form>
  </div>

  <div class="success-message" id="successMessage">
    ✅ Script berhasil disalin ke clipboard!
  </div>

  <script>
    let emailTags = [];

    function generateScript() {
      var emailServer = document.getElementById("emailServer").value;
      var routerOsVersion = document.getElementById("routerOsVersion").value;
      var emailSender = document.getElementById("emailSender").value;
      var emailPassword = document.getElementById("emailPassword").value;
      var intervalBackup = document.getElementById("intervalBackup").value;
      var title = document.getElementById("title").value;
      
      var emailRecipient = getAllEmails();

      var script = "";
      
      if (routerOsVersion === "v7") {
        script += "/tool e-mail set from=\"Pejuang GSM\" port=587 server=\"" + emailServer + "\" tls=starttls user=\"" + emailSender + "\"\r\n";
        script += "/tool e-mail set password=\"" + emailPassword + "\"\r\n";
      } else {
        script += "/tool e-mail set address=\"" + emailServer + "\" from=\"Pejuang GSM\" password=\"" + emailPassword + "\" port=587 start-tls=yes user=\"" + emailSender + "\"\r\n";
      }
      
      script += "/system scheduler add interval=" + intervalBackup + " name=\"AutoBackupDual\" on-event=\"backupdual\" policy=ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon start-date=feb/21/1993 start-time=00:00:00\r\n";
      
      script += "/system script add dont-require-permissions=no name=backupdual owner=admin policy=ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon source=\":local sysdate [/system clock get date]\\r\\\n";
      script += "\\n:local systime [/system clock get time]\\r\\\n";
      script += "\\n:local year [:pick \\$sysdate 0 4]\\r\\\n";
      script += "\\n:local month [:pick \\$sysdate 5 7]\\r\\\n";
      script += "\\n:local day [:pick \\$sysdate 8 10]\\r\\\n";
      script += "\\n:local monthname\\r\\\n";
      script += "\\n:if (\\$month=\\\"01\\\") do={\\r\\\n";
      script += "\\n    :set monthname \\\"Januari\\\"\\r\\\n";
      script += "\\n} else={\\r\\\n";
      script += "\\n    :if (\\$month=\\\"02\\\") do={\\r\\\n";
      script += "\\n        :set monthname \\\"Februari\\\"\\r\\\n";
      script += "\\n    } else={\\r\\\n";
      script += "\\n        :if (\\$month=\\\"03\\\") do={\\r\\\n";
      script += "\\n            :set monthname \\\"Maret\\\"\\r\\\n";
      script += "\\n        } else={\\r\\\n";
      script += "\\n            :if (\\$month=\\\"04\\\") do={\\r\\\n";
      script += "\\n                :set monthname \\\"April\\\"\\r\\\n";
      script += "\\n            } else={\\r\\\n";
      script += "\\n                :if (\\$month=\\\"05\\\") do={\\r\\\n";
      script += "\\n                    :set monthname \\\"Mei\\\"\\r\\\n";
      script += "\\n                } else={\\r\\\n";
      script += "\\n                    :if (\\$month=\\\"06\\\") do={\\r\\\n";
      script += "\\n                        :set monthname \\\"Juni\\\"\\r\\\n";
      script += "\\n                    } else={\\r\\\n";
      script += "\\n                        :if (\\$month=\\\"07\\\") do={\\r\\\n";
      script += "\\n                            :set monthname \\\"Juli\\\"\\r\\\n";
      script += "\\n                        } else={\\r\\\n";
      script += "\\n                            :if (\\$month=\\\"08\\\") do={\\r\\\n";
      script += "\\n                                :set monthname \\\"Agustus\\\"\\r\\\n";
      script += "\\n                            } else={\\r\\\n";
      script += "\\n                                :if (\\$month=\\\"09\\\") do={\\r\\\n";
      script += "\\n                                    :set monthname \\\"September\\\"\\r\\\n";
      script += "\\n                                } else={\\r\\\n";
      script += "\\n                                    :if (\\$month=\\\"10\\\") do={\\r\\\n";
      script += "\\n                                        :set monthname \\\"Oktober\\\"\\r\\\n";
      script += "\\n                                    } else={\\r\\\n";
      script += "\\n                                        :if (\\$month=\\\"11\\\") do={\\r\\\n";
      script += "\\n                                            :set monthname \\\"November\\\"\\r\\\n";
      script += "\\n                                        } else={\\r\\\n";
      script += "\\n                                            :if (\\$month=\\\"12\\\") do={\\r\\\n";
      script += "\\n                                                :set monthname \\\"Desember\\\"\\r\\\n";
      script += "\\n                                            }\\r\\\n";
      script += "\\n                                        }\\r\\\n";
      script += "\\n                                    }\\r\\\n";
      script += "\\n                                }\\r\\\n";
      script += "\\n                            }\\r\\\n";
      script += "\\n                        }\\r\\\n";
      script += "\\n                    }\\r\\\n";
      script += "\\n                }\\r\\\n";
      script += "\\n            }\\r\\\n";
      script += "\\n        }\\r\\\n";
      script += "\\n    }\\r\\\n";
      script += "\\n}\\r\\\n";
      script += "\\n:log warning \\\"-> Memulai Complete Auto Email Backup (.rsc + .backup)\\\"\\r\\\n";
	  script += "\\n:local filename ([/system identity get name] . \\\"@\\\" . \\$day . \\\" \\\" . \\$monthname . \\\" \\\" . \\$year . \\\" \\\" . \\$systime)\\r\\\n";
      script += "\\n\\r\\\n";
      script += "\\n# Create RSC file\\r\\\n";
      script += "\\n/export terse file=\\$filename\\r\\\n";
      script += "\\n:delay 10s\\r\\\n";
      script += "\\n\\r\\\n";
      script += "\\n# Create BACKUP file\\r\\\n";
      script += "\\n/system backup save name=\\$filename\\r\\\n";
      script += "\\n:delay 10s\\r\\\n";
      script += "\\n\\r\\\n";
      script += "\\n# Send both files in one email\\r\\\n";
      script += "\\n:log warning \\\"-> Kedua File (.rsc + .backup) Sedang Dikirim\\\"\\r\\\n";
      script += "\\n/tool e-mail send to=\\\"" + emailRecipient + "\\\" subject=(\\\"" + title + " - \\\" . [/system identity get name] . \\\" Backup Success @ \\\" . \\$day . \\\" \\\" . \\$monthname . \\\" \\\" . \\$year . \\\" \\\" . \\$systime) file=(\\$filename . \\\".rsc\\\",\\$filename . \\\".backup\\\")\\r\\\n";
      script += "\\n:delay 30s\\r\\\n";
      script += "\\n:log warning \\\"-> Kedua Backup File (.rsc + .backup) Telah Berhasil Dikirim\\\"\\r\\\n";
      script += "\\n\\r\\\n";
      script += "\\n# Clean up files\\r\\\n";
      script += "\\n/file remove (\\$filename . \\\".rsc\\\")\\r\\\n";
      script += "\\n/file remove (\\$filename . \\\".backup\\\")\\r\\\n";
      script += "\\n:delay 5s\\r\\\n";
      script += "\\n:log warning \\\"-> Complete Auto Backup Files Ke Email Selesai\\\"\\r\\\n";
      script += "\\n\"";

      document.getElementById("backupResult").value = script;
      
      document.getElementById("backupResult").style.transform = "scale(1.02)";
      setTimeout(() => {
        document.getElementById("backupResult").style.transform = "scale(1)";
      }, 200);
    }

    function getAllEmails() {
      var inputValue = document.getElementById("emailRecipient").value.trim();
      var allEmails = [...emailTags];
      
      if (inputValue) {
        allEmails.push(inputValue);
      }
      
      return allEmails.join(',');
    }

    function addEmailTag(email) {
      if (email && !emailTags.includes(email)) {
        emailTags.push(email);
        renderEmailTags();
      }
    }

    function removeEmailTag(email) {
      emailTags = emailTags.filter(tag => tag !== email);
      renderEmailTags();
    }

    function renderEmailTags() {
      var emailTagsContainer = document.getElementById("emailTags");
      emailTagsContainer.innerHTML = "";
      
      emailTags.forEach(email => {
        var tag = document.createElement("div");
        tag.className = "email-tag";
        tag.innerHTML = `
          <span>${email}</span>
          <span class="remove-tag" onclick="removeEmailTag('${email}')">×</span>
        `;
        emailTagsContainer.appendChild(tag);
      });
    }

    function isValidEmail(email) {
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function clearForm() {
      document.getElementById("emailServer").value = "74.125.24.109";
      document.getElementById("routerOsVersion").value = "v6";
      document.getElementById("emailSender").value = "mikrotikrosbackup@gmail.com";
      document.getElementById("emailPassword").value = "letkntbrshcipraz";
      document.getElementById("intervalBackup").value = "1d";
      document.getElementById("title").value = "";
      document.getElementById("emailRecipient").value = "";
      document.getElementById("backupResult").value = "";
      emailTags = [];
      renderEmailTags();
    }

    function copyScript() {
      var backupResult = document.getElementById("backupResult");
      backupResult.select();
      backupResult.setSelectionRange(0, 99999);
      
      try {
        document.execCommand("copy");
        showSuccessMessage();
      } catch (err) {
        alert("Script berhasil disalin!");
      }
    }

    function showSuccessMessage() {
      var successMessage = document.getElementById("successMessage");
      successMessage.classList.add("show");
      
      setTimeout(() => {
        successMessage.classList.remove("show");
      }, 3000);
    }

    document.getElementById("emailRecipient").addEventListener("input", function(e) {
      var value = e.target.value;
      var commaIndex = value.indexOf(',');
      
      if (commaIndex !== -1) {
        var email = value.substring(0, commaIndex).trim();
        if (isValidEmail(email)) {
          addEmailTag(email);
          e.target.value = value.substring(commaIndex + 1).trim();
        }
      }
    });

    document.getElementById("emailRecipient").addEventListener("keydown", function(e) {
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        var email = e.target.value.trim();
        if (isValidEmail(email)) {
          addEmailTag(email);
          e.target.value = "";
        }
      }
      
      if (e.key === "Backspace" && e.target.value === "" && emailTags.length > 0) {
        e.preventDefault();
        removeEmailTag(emailTags[emailTags.length - 1]);
      }
    });

    document.querySelectorAll('input:not(#emailRecipient), select, textarea').forEach(element => {
      element.addEventListener('focus', function() {
        this.parentElement.style.transform = 'translateY(-2px)';
      });
      
      element.addEventListener('blur', function() {
        this.parentElement.style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
