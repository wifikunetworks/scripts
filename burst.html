<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik Burst Limit Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1877F2 0%, #4267B2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header-container {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            background: linear-gradient(45deg, #1877F2, #4267B2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .attribution {
            position: absolute;
            bottom: -8px;
            right: 0;
            margin-right: 40px;
            font-size: 0.75em;
            color: #888;
            font-weight: 400;
            background: linear-gradient(45deg, #1877F2, #4267B2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.8;
            font-style: italic;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .form-group:focus-within {
            border-color: #1877F2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(24, 119, 242, 0.2);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1877F2;
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.1);
        }

        .dual-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .dual-input input {
            flex: 1;
        }

        .dual-input span {
            font-weight: bold;
            color: #1877F2;
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #1877F2, #4267B2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(24, 119, 242, 0.3);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .results {
            display: none;
            background: linear-gradient(135deg, #1565C0, #1877F2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .results h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
            text-align: center;
        }

        .output-code {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }

        .explanation {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .explanation h4 {
            color: #FFD700;
            margin-bottom: 10px;
        }

        .explanation ul {
            list-style-type: none;
            padding-left: 0;
        }

        .explanation li {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .explanation li:last-child {
            border-bottom: none;
        }

        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .copy-btn:hover {
            background: #45a049;
        }

        .highlight {
            color: #FFD700;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .attribution {
                font-size: 0.7em;
                bottom: -6px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>🚀 MikroTik Burst Limit Generator</h1>
            <div class="attribution">by Keripik Kinta</div>
        </div>
        
        <form id="burstForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="maxLimit">Max Limit (Limit Awal)</label>
                    <div class="dual-input">
                        <input type="text" id="maxLimitUL" placeholder="Upload (e.g., 3M)" required>
                        <span>/</span>
                        <input type="text" id="maxLimitDL" placeholder="Download (e.g., 5M)" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="additionalLimit">Tambahan Limit (Burst)</label>
                    <div class="dual-input">
                        <input type="text" id="additionalUL" placeholder="Upload tambahan (e.g., 2M)" required>
                        <span>/</span>
                        <input type="text" id="additionalDL" placeholder="Download tambahan (e.g., 3M)" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="burstThreshold">Burst Threshold (%)</label>
                    <input type="number" id="burstThreshold" min="1" max="100" value="75" required>
                </div>

                <div class="form-group">
                    <label for="limitAt">Limit At (%)</label>
                    <input type="number" id="limitAt" min="1" max="100" value="30" required>
                </div>

                <div class="form-group">
                    <label for="burstTime">Burst Time (detik)</label>
                    <input type="number" id="burstTime" min="1" max="60" value="15" required>
                </div>

                <div class="form-group">
                    <label for="priority">Prioritas</label>
                    <select id="priority" required>
                        <option value="1">1 (Tertinggi)</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8" selected>8 (Default)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="generate-btn">🔥 Generate Burst Configuration</button>
        </form>

        <div id="results" class="results">
            <h3>📋 Hasil Konfigurasi MikroTik</h3>
            <div class="output-code" id="outputCode"></div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy ke Clipboard</button>
            
            <div class="explanation">
                <h4>📊 Penjelasan Konfigurasi:</h4>
                <ul id="explanationList"></ul>
            </div>
        </div>
    </div>

    <script>
        function parseSize(sizeStr) {
            sizeStr = sizeStr.toString().toUpperCase();
            if (sizeStr.includes('M')) {
                return parseFloat(sizeStr.replace('M', '')) * 1000; // Decimal basis
            } else if (sizeStr.includes('K')) {
                return parseFloat(sizeStr.replace('K', ''));
            } else {
                return parseFloat(sizeStr);
            }
        }

        function formatSize(sizeKb) {
            if (sizeKb >= 1000) {
                const mbps = sizeKb / 1000;
                // Jika bilangan bulat, tampilkan tanpa desimal
                if (mbps % 1 === 0) {
                    return Math.round(mbps) + 'M';
                } else {
                    // Jika ada desimal, konversi ke kbps
                    return Math.round(sizeKb) + 'k';
                }
            } else {
                return Math.round(sizeKb) + 'k';
            }
        }

        function calculateBurstDuration(maxLimitKb, burstLimitKb, burstTime) {
            // Rumus durasi burst berdasarkan bucket size dan excess bandwidth
            const excessBandwidth = burstLimitKb - maxLimitKb;
            const bucketSize = maxLimitKb * burstTime; // Simplified bucket calculation
            const actualDuration = bucketSize / burstLimitKb;
            return Math.round(actualDuration * 10) / 10; // Round to 1 decimal
        }

        document.getElementById('burstForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get input values and convert to uppercase
            const maxUL = document.getElementById('maxLimitUL').value.toUpperCase();
            const maxDL = document.getElementById('maxLimitDL').value.toUpperCase();
            const addUL = document.getElementById('additionalUL').value.toUpperCase();
            const addDL = document.getElementById('additionalDL').value.toUpperCase();
            const thresholdPercent = parseInt(document.getElementById('burstThreshold').value);
            const limitAtPercent = parseInt(document.getElementById('limitAt').value);
            const burstTime = parseInt(document.getElementById('burstTime').value);
            const priority = document.getElementById('priority').value;

            // Parse sizes to KB
            const maxULKb = parseSize(maxUL);
            const maxDLKb = parseSize(maxDL);
            const addULKb = parseSize(addUL);
            const addDLKb = parseSize(addDL);

            // Calculate burst limits
            const burstULKb = maxULKb + addULKb;
            const burstDLKb = maxDLKb + addDLKb;

            // Calculate thresholds
            const thresholdULKb = Math.round(maxULKb * (thresholdPercent / 100));
            const thresholdDLKb = Math.round(maxDLKb * (thresholdPercent / 100));

            // Calculate limit-at
            const limitAtULKb = Math.round(maxULKb * (limitAtPercent / 100));
            const limitAtDLKb = Math.round(maxDLKb * (limitAtPercent / 100));

            // Calculate actual burst duration
            const burstDurationUL = calculateBurstDuration(maxULKb, burstULKb, burstTime);
            const burstDurationDL = calculateBurstDuration(maxDLKb, burstDLKb, burstTime);

            // Generate output
            const output = `${formatSize(maxULKb)}/${formatSize(maxDLKb)} ${formatSize(burstULKb)}/${formatSize(burstDLKb)} ${formatSize(thresholdULKb)}/${formatSize(thresholdDLKb)} ${burstTime}/${burstTime} ${priority} ${formatSize(limitAtULKb)}/${formatSize(limitAtDLKb)}`;

            // Display results
            document.getElementById('outputCode').textContent = output;
            
            // Generate explanation
            const explanationList = document.getElementById('explanationList');
            explanationList.innerHTML = `
                <li><strong>Max Limit:</strong> ${formatSize(maxULKb)}/${formatSize(maxDLKb)} (${(maxULKb/1000).toFixed(1)} Mbps UL / ${(maxDLKb/1000).toFixed(1)} Mbps DL)</li>
                <li><strong>Burst Limit:</strong> <span class="highlight">${formatSize(burstULKb)}/${formatSize(burstDLKb)} (${(burstULKb/1000).toFixed(1)} Mbps UL / ${(burstDLKb/1000).toFixed(1)} Mbps DL)</span></li>
                <li><strong>Burst Threshold:</strong> ${formatSize(thresholdULKb)}/${formatSize(thresholdDLKb)} (${thresholdPercent}% dari max limit)</li>
                <li><strong>Burst Time:</strong> ${burstTime} detik (waktu maksimum burst)</li>
                <li><strong>Durasi Burst Aktual:</strong> <span class="highlight">~${burstDurationUL} detik UL / ~${burstDurationDL} detik DL</span></li>
                <li><strong>Prioritas:</strong> ${priority}</li>
                <li><strong>Limit At:</strong> ${formatSize(limitAtULKb)}/${formatSize(limitAtDLKb)} (${limitAtPercent}% guaranteed bandwidth)</li>
                <li><strong>Tambahan Kecepatan:</strong> <span class="highlight">+${(addULKb/1000).toFixed(1)} Mbps UL / +${(addDLKb/1000).toFixed(1)} Mbps DL saat burst aktif</span></li>
            `;

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        });

        function copyToClipboard() {
            const outputText = document.getElementById('outputCode').textContent;
            navigator.clipboard.writeText(outputText).then(function() {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                btn.style.background = '#2196F3';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#4CAF50';
                }, 2000);
            });
        }

        // Add some default values for demo
        document.getElementById('maxLimitUL').value = '3M';
        document.getElementById('maxLimitDL').value = '5M';
        document.getElementById('additionalUL').value = '3M';
        document.getElementById('additionalDL').value = '3M';
    </script>
</body>
</html>
